<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Photos Minimal Example</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4285F4;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(66, 133, 244, 0.39);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.23);
            filter: brightness(1.1);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        #auth-section,
        #photos-section {
            margin-top: 20px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .photo-card:hover {
            transform: scale(1.02);
        }

        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .photo-info {
            padding: 12px;
            font-size: 0.9rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin: 20px;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Photo Lens</h1>
            <p>A minimal Google Photos integration example</p>
        </header>

        <div id="loading" class="hidden">
            <span class="loader"></span>
            <p>Fetching your memories...</p>
        </div>

        <div id="auth-section" class="hidden">
            <a href="/auth/google" class="btn btn-primary">Connect Google Photos</a>
        </div>

        <div id="photos-section" class="hidden">
            <button onclick="fetchPhotos()" class="btn btn-primary">Refresh Library</button>
            <button onclick="startPicker()" class="btn btn-primary"
                style="background: #34a853; box-shadow: 0 4px 14px 0 rgba(52, 168, 83, 0.39);">Select Photos
                (Picker)</button>
            <button onclick="checkToken()" class="btn btn-outline">Debug Token</button>
            <a href="/auth/logout" class="btn btn-outline"
                style="border-color: rgba(239, 68, 68, 0.4); color: #f87171;">Disconnect</a>
        </div>

        <div id="picker-status" class="hidden"
            style="margin: 20px 0; padding: 15px; background: rgba(52, 168, 83, 0.1); border: 1px solid rgba(52, 168, 83, 0.2); border-radius: 8px; color: #34a853;">
            Picker opened! Please select photos in the new tab and then return here.
        </div>

        <div id="debug-info"
            style="margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; font-family: monospace; font-size: 0.8rem; text-align: left; max-height: 200px; overflow-y: auto;"
            class="hidden"></div>

        <div id="content-title" style="margin-top: 40px; text-align: left; font-size: 1.5rem; font-weight: 600;">
            Latest Photos</div>
        <div id="photo-grid" class="photo-grid"></div>

        <div id="album-section" style="margin-top: 60px;">
            <div style="text-align: left; font-size: 1.5rem; font-weight: 600; margin-bottom: 20px;">Your Albums
            </div>
            <div id="album-grid" class="photo-grid"></div>
        </div>
    </div>
    </div>

    <script>
        function logDebug(msg, data) {
            const debug = document.getElementById('debug-info');
            debug.classList.remove('hidden');
            const entry = document.createElement('div');
            entry.style.marginBottom = '10px';
            entry.innerHTML = `<strong>${msg}</strong>: <pre>${JSON.stringify(data, null, 2)}</pre>`;
            debug.prepend(entry);
        }

        async function checkStatus() {
            const resp = await fetch('/api/status');
            const data = await resp.json();

            if (data.connected) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('photos-section').classList.remove('hidden');
                fetchPhotos();
                fetchAlbums();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('photos-section').classList.add('hidden');
            }
        }

        async function fetchPhotos() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('photo-grid');
            const title = document.getElementById('content-title');

            loading.classList.remove('hidden');
            title.textContent = 'Latest Photos';
            grid.innerHTML = '';

            try {
                const resp = await fetch('/api/photos');
                const data = await resp.json();

                loading.classList.add('hidden');
                logDebug('Photos API Response', data);

                if (data.mediaItems && data.mediaItems.length > 0) {
                    data.mediaItems.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'photo-card';
                        const proxyUrl = `/api/proxy-image?url=${encodeURIComponent(item.baseUrl + '=w400')}`;
                        card.innerHTML = `
                            <img src="${proxyUrl}" alt="${item.filename}">
                            <div class="photo-info">${item.filename}</div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; background: rgba(255,255,255,0.02); border-radius: 12px; color: var(--text-dim);">No photos found in your library. <br><small>Note: Only photos uploaded via this app OR items explicitly shared might appear depending on Google\'s privacy restrictions for unverified apps.</small></div>';
                }
            } catch (err) {
                console.error(err);
                loading.classList.add('hidden');
                grid.innerHTML = '<p>Error fetching photos.</p>';
            }
        }

        async function fetchAlbums() {
            const grid = document.getElementById('album-grid');
            grid.innerHTML = '<p style="color: var(--text-dim)">Loading albums...</p>';

            try {
                const resp = await fetch('/api/albums');
                const data = await resp.json();
                logDebug('Albums API Response', data);
                grid.innerHTML = '';

                if (data.albums && data.albums.length > 0) {
                    data.albums.forEach(album => {
                        const card = document.createElement('div');
                        card.className = 'photo-card';
                        const coverUrl = album.coverPhotoBaseUrl || 'https://via.placeholder.com/400x400?text=No+Cover';
                        const proxyUrl = coverUrl.includes('googleusercontent')
                            ? `/api/proxy-image?url=${encodeURIComponent(coverUrl + '=w400')}`
                            : coverUrl;

                        card.innerHTML = `
                            <img src="${proxyUrl}" alt="${album.title}">
                            <div class="photo-info">
                                <strong>${album.title}</strong><br>
                                <span style="font-size: 0.8rem">${album.mediaItemsCount || 0} items</span>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p style="color: var(--text-dim)">No albums found.</p>';
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<p>Error fetching albums.</p>';
            }
        }

        async function checkToken() {
            try {
                const resp = await fetch('/api/token-debug');
                const data = await resp.json();
                logDebug('Token Scopes Debug', data);
            } catch (err) {
                console.error(err);
            }
        }

        async function startPicker() {
            const statusDiv = document.getElementById('picker-status');
            try {
                const resp = await fetch('/api/picker/start');
                const data = await resp.json();

                if (data.pickerUri) {
                    window.open(data.pickerUri, '_blank');
                    statusDiv.classList.remove('hidden');

                    // Start polling for status
                    const pollInterval = setInterval(async () => {
                        console.log('Polling picker status...');
                        const statusResp = await fetch(`/api/picker/status/${data.id}`);
                        const statusData = await statusResp.json();

                        if (statusData.ready) {
                            clearInterval(pollInterval);
                            logDebug('Picker Finished', statusData);
                            statusDiv.textContent = `Success! Received ${statusData.items.length} photos from Picker. Rendering below...`;
                            renderPickedPhotos(statusData.items);
                        }
                    }, 3000);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderPickedPhotos(items) {
            const grid = document.getElementById('photo-grid');
            const title = document.getElementById('content-title');
            title.textContent = 'Selected via Picker';
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; background: rgba(255,255,255,0.02); border-radius: 12px; color: var(--text-dim); text-align: center;">Picker returned 0 items. This can happen if the session expired or no selection was made.</div>';
                return;
            }

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.style.position = 'relative';

                // Use proxy to avoid 403 Forbidden errors
                const imgUrl = (item.mediaFile && item.mediaFile.baseUrl) ||
                    item.baseUrl ||
                    (item.mediaMetadata && item.mediaMetadata.baseUrl);

                const finalUrl = imgUrl ? `/api/proxy-image?url=${encodeURIComponent(imgUrl + '=w400')}` : null;
                const filename = (item.mediaFile && item.mediaFile.filename) || item.filename || `Item ${index + 1}`;

                // Check for location data
                const hasLocation = item.mediaFile && item.mediaFile.mediaFileMetadata && item.mediaFile.mediaFileMetadata.location;
                const locationInfo = hasLocation ?
                    `📍 ${item.mediaFile.mediaFileMetadata.location.latitude.toFixed(4)}, ${item.mediaFile.mediaFileMetadata.location.longitude.toFixed(4)}` :
                    `🚫 No Location Data`;

                card.innerHTML = `
                    ${finalUrl ? `<img src="${finalUrl}" alt="Photo">` : `<div style="height: 200px; display: flex; align-items: center; justify-content: center; background: #000; color: #ff4444; font-size: 0.8rem; text-align: center; padding: 10px;">URL Missing in API Response</div>`}
                    <div class="photo-info" style="display: flex; flex-direction: column; gap: 5px; white-space: normal;">
                        <strong>${filename}</strong>
                        <span style="font-size: 0.8rem; color: ${hasLocation ? '#34a853' : '#f87171'}">${locationInfo}</span>
                        <button onclick='alert(JSON.stringify(${JSON.stringify(item)}, null, 2))' 
                                style="background: rgba(255,255,255,0.1); border: none; color: #ccc; font-size: 0.7rem; padding: 5px; border-radius: 4px; cursor: pointer; margin-top: 5px;">
                            Show Raw Item JSON
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        checkStatus();
    </script>
</body>

</html>
